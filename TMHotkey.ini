; TMHotkey 配置文件
; 路径: Data/SKSE/Plugins/TMHotkey.ini
; 修改后需要重新读档（或重启游戏）生效。

[Hotkey]
; 触发键（DIK 十进制扫描码）
; 常用键位参考：
;   F1-F12 = 59-68      （F8 = 66）
;   数字键 0-9 = 11,2-10
;   小键盘 0-9 = 82,79-89
;   字母 A-Z = 30-58 顺序（A=30 ... Z=58）
;   Tab=15  Caps=58  Space=57  Enter=28  Backspace=14
Key = 66

; 是否要求同时按住修饰键
RequireCtrl = false
RequireAlt = false
RequireShift = false

; 组合键示例：想要 Ctrl+F8，就把 RequireCtrl 改为 true
