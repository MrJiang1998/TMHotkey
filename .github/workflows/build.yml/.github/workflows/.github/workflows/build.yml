name: 编译 TMHotkey

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Windows 云端编译 TMHotkey
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: 生成版本号
        shell: bash
        run: echo "BUILD_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: CMake 配置（vcpkg 自动装 CommonLibSSE-NG）
        shell: cmd
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_BUILD_TYPE=Release

      - name: 编译 Release
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: 复制配置与插件到安装目录
        shell: cmd
        run: |
          if not exist "dist\SKSE\Plugins" mkdir "dist\SKSE\Plugins"
          copy /Y "TMHotkey.ini" "dist\SKSE\Plugins\TMHotkey.ini"
          if not exist "dist\SKSE\Plugins\TMHotkey.dll" (echo DLL 未生成 & exit /b 1)
          dir dist\SKSE\Plugins

      - name: 打包可安装 zip
        shell: cmd
        run: |
          cd dist
          powershell -NoProfile -Command "Compress-Archive -Path 'SKSE' -DestinationPath '../TMHotkey-1.0.0-%BUILD_DATE%.zip' -Force"
          cd ..
          dir *.zip

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: TMHotkey-已编译成品
          path: TMHotkey-1.0.0-*.zip
          retention-days: 30
